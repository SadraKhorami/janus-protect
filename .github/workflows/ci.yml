name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP transformer dependencies
        working-directory: services/php-transformer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy main to production
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://janus.khorami.dev

    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/janus_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/janus_deploy ~/.ssh/known_hosts

      - name: Back up and deploy verified commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/janus_deploy -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/janus-protect && git fetch origin main --tags && git show '${GITHUB_SHA}:scripts/deploy.sh' > /tmp/janus-deploy.sh && chmod 700 /tmp/janus-deploy.sh && JANUS_ROOT=/opt/janus-protect /tmp/janus-deploy.sh --ref '${GITHUB_SHA}'"

      - name: Verify public application
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://janus.khorami.dev/ >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://janus.khorami.dev/health/ready >/dev/null
