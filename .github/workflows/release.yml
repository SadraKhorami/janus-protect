name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP transformer dependencies
        working-directory: services/php-transformer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Verify release build
        run: pnpm check

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-24.04

    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Janus Protect ${GITHUB_REF_NAME}"
